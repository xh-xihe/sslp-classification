<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="568" viewBox="0 0 1200 568" role="img" aria-labelledby="title description">
  <title id="title">SSLP proof map</title>
  <desc id="description">A reading map from SS foundations through general theory and six-qubit certificates to physical classification theorems. Kernel verification and version-specific manuscript review have separate evidence routes.</desc>
