    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#7d91b8"/></marker>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#8ea7de" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="568" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="568" rx="20" fill="url(#dots)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
