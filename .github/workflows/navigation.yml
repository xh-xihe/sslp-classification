name: Documentation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    name: Links, assets, explorer, and checker regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/check_navigation.py
      - run: python -m unittest discover -s tools/tests -p test_navigation.py -v
      - run: python tools/build_explorer.py --check
      - run: python -m unittest discover -s tools/tests -p test_proof_explorer.py -v

# This lightweight workflow checks repository presentation, not Lean proofs
# or manuscript correspondence. Those have separate acceptance records.
